<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="x-apple-disable-message-reformatting">
  <title>{{subject}}</title>
</head>
<body bgcolor="#ffffff" style="width:100%;margin:0;padding:0;background-color:#ffffff;color:#202020;font-family:Georgia,'Times New Roman',Times,serif">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="width:100%;margin:0;padding:0;background-color:#ffffff;border-collapse:collapse;border-spacing:0">
    <tbody>
      <tr>
        <td align="center" valign="top" style="padding:32px 20px">
          <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:600px;margin:0 auto;border-collapse:collapse;border-spacing:0">
            <tbody>
              <tr>
                <td align="left" valign="top" style="padding:0;font-family:Georgia,'Times New Roman',Times,serif;font-size:17px;line-height:1.65;color:#202020;text-align:left;word-break:break-word;overflow-wrap:anywhere">
                  {{body}}
                </td>
              </tr>

              <tr>
                <td align="left" valign="top" style="padding:10px 0 0;font-family:Georgia,'Times New Roman',Times,serif;font-size:15px;line-height:1.6;color:#4f4f4f;text-align:left;word-break:break-word;overflow-wrap:anywhere">
                  {{signature}}
                </td>
              </tr>
            </tbody>
          </table>
        </td>
      </tr>
    </tbody>
  </table>
</body>
</html>
